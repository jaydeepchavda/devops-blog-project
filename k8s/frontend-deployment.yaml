apiVersion: apps/v1

kind: Deployment


metadata: 
  name: frontend
  namespace: devops-blog

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0


  selector:
    matchLabels: 
      app: frontend


  template:
    metadata: 
      labels:
        app: frontend


    spec:
      containers:
        - name: frontend
          image: jaydipaws/devops-blog-frontend:v1
          ports: 
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5 
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

              #livenessProbe:
            #httpGet:
              #path: /
                #port: 3000
                #initialDelaySeconds: 30
              #periodSeconds: 10 
              #timeoutSeconds: 5
              #failureThreshold: 3
              #successThreshold: 1

