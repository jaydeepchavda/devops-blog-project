apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-blog

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 8080

        env:
        - name: MONGO_URL
          value: "{{ .Values.env.mongoUrl }}"
        
        resources: 
          requests: 
            memory: "128Mi" 
            cpu: "100m" 
        
          limits: 
            memory: "256Mi" 
            cpu: "200m"
         

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
