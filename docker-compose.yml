version: "3"
  


services:

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongo:27017/test
    depends_on:
      - mongo


  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend


  mongo:
    image: mongo:6
    container_name: mongo
    ports: 
      - "27017:27017"
