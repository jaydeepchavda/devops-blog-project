version: "3"
  


services:

  backend:
    image: jaydipaws/devops-blog-frontend:v1
      #container_name: backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongo:27017/test
    depends_on:
      - mongo


  frontend:
    image: jaydipaws/devops-blog-frontend:v1
      #container_name: frontend
    ports:
      - "8081:3000"
    depends_on:
      - backend


  mongo:
    image: mongo:6
      #container_name: mongo
      #for mongo service to backend 
    ports: 
      - "27017:27017"
