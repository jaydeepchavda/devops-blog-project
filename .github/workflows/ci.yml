name: build and push docker images


on:
  push:
    branches:
      - main

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4



      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18


      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: validate frontend Build
        run: |
          cd frontend 
          npm run build


  frontend:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      #1 checkout repository code
      - name: checkout code
        uses: actions/checkout@v4



      #login to docker hub
      - name: Docker login 
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}


      #Build and Push Frontend Images
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with: 
          context: ./frontend
          push: true
          tags: |
            jaydipaws/devops-blog-frontend:${{github.sha}}
            jaydipaws/devops-blog-backend:latest


  backend: 
    runs-on: ubuntu-latest
    needs: frontend

    steps:


      #1 checkout repository code
      - name: checkout code
        uses: actions/checkout@v4
      

      # 6. Helm lint validation 👈 HERE 
      - name: Lint Helm Chart 
        run: |
          helm lint ./helm/backend-chart

    
      - name: Check Deployment Rollout
        run: |
          kubectl rollout status deployment/backend -n devops-blog


      #2 login to docker hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}



      #3 build and push backend image
      - name: Build and push Bachend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            jaydipaws/devops-blog-backend:${{github.sha}}
            jaydipaws/devops-blog-backend:latest

