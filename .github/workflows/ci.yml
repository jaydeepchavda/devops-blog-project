name: build and push docker imagesi


on:
  push:
    branch:
      - main

jobs:

  frontend:
    runs-on: ubuntu-latest


    steps:
      #1 checkout repository code
      - name: checkout code
        uses: actions/checkout@v4



      #login to docker hub
      - name: Docker login 
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}


      #Build and Push Frontend Images
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with: 
          context: ./frontend
          push: true
          tags: jaydipaws/devops-blog-frontend:${{github.sha}}


  backend: 
    runs-on: ubuntu-latest
    needs: frontend

    steps:


      #1 checkout repository code
      - name: checkout code
        uses: actions/checkout@v4



      #2 login to docker hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}



      #3 build and push backend image
      - name: Build and push Bachend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: jaydipaws/devops-blog-backend:${{github.sha}} 
